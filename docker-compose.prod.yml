version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uv", "run", "uvicorn", "src.api.server:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    environment:
      - ENV=production
      - ALLOWED_ORIGINS=http://localhost,http://127.0.0.1
    volumes:
      - market_data:/app
    restart: always
    # No ports exposed directly, handled by nginx

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE=/api
        - NEXT_PUBLIC_WS_URL=/ws
    restart: always
    # No ports exposed directly, handled by nginx

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    restart: always

volumes:
  market_data:
    # This will persist market.db and chroma_db if they are in the root /app
    # Note: market.db is in /app/market.db, chroma_db is in /app/chroma_db
