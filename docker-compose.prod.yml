# Production-oriented compose file: backend API, Next.js frontend, and nginx reverse proxy.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uv", "run", "uvicorn", "src.api.server:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    environment:
      - ENV=production
      - ALLOWED_ORIGINS=http://localhost,http://127.0.0.1
    volumes:
      - market_data:/app/market.db
      - chroma_data:/app/chroma_db
    restart: always
    # No ports exposed directly, handled by nginx

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE=/api
        - NEXT_PUBLIC_WS_URL=/ws
    restart: always
    # No ports exposed directly, handled by nginx

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    restart: always

volumes:
  market_data:
    # Persists the SQLite database file.
  chroma_data:
    # Persists the ChromaDB vector store.
