# Development compose file that runs the API + web UI, with optional terminal UI.

services:
  backend:
    build: .
    command: ["uv", "run", "uvicorn", "src.api.server:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    environment:
      - ENV=development
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - .:/app
      - /app/.venv
    ports:
      - "8000:8000"

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws
      - NEXT_PUBLIC_API_KEY=${API_KEY}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend

  terminal:
    build: .
    command: ["uv", "run", "main.py"]
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/.venv
    tty: true
    stdin_open: true
    profiles:
      - terminal
